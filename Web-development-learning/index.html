<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guepardex</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         BARRA DE NAVEGACIÓN
    ========================== -->

    <header class="site-header">

        <nav class="main-nav">

            <!-- Botón del menú -->

            <button class="menu-button" id="menu-button">

                <svg xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />

                    <path d="M4 20h16" />
                    <path d="M4 12h16" />
                    <path d="M4 4h16" />

                </svg>

            </button>


            <!-- Logo -->

            <a href="#" class="brand-link">

                <img id="brand-logo"
                    src="/images/Logo.webp"
                    alt="Logo de Guepardex"
                >

                <span class="brand-name">
                    Guepardex
                </span>

            </a>


            <!-- Botón XE -->

            <button class="xe-button">

                <a href="#XE">
                    Consigue XE
                </a>

            </button>

        </nav>

    </header>


    <!-- =========================
         CONTENIDO PRINCIPAL
    ========================== -->

    <main>

        <!-- HERO -->

        <section class="hero">


            <!-- Información del sistema -->

            <div class="hero-info">

                <span class="protocol-label">
                    [ PROTOCOL: HIGH_OCTANE ]
                </span>

                <span class="system-version">
                    SYS.VER // 2004.X
                </span>

            </div>


            <!-- Presentación del producto -->

            <div class="hero-content">

                <p class="hero-description">
                    LA BEBIDA ENERGÉTICA EXTREMA
                </p>

                <h1 class="hero-title">
                    CHEETAH
                    <br>
                    CHUG
                </h1>

                <span class="hero-slogan">
                    // LIBERA TU VELOCIDAD INTERNA //
                </span>

            </div>


            <!-- =========================
                 INFORMACIÓN DEL PRODUCTO
            ========================== -->

            <section class="product-stats">


                <!-- Imagen del producto -->

                <div class="product-image">

                    <img
                        src="/images/Latita-1.webp"
                        alt="Lata de Cheetah Chug"
                    >

                </div>


                <!-- Nivel de octanaje -->

                <div class="stat">

                    <span class="stat-label">
                        OCTANE LEVEL
                    </span>

                    <strong class="stat-value">
                        1400%
                    </strong>

                </div>


                <!-- Aumento de BPM -->

                <div class="stat">

                    <span class="stat-label">
                        BPM BOOST
                    </span>

                    <strong class="bpm-value">
                        +180 BPM
                    </strong>

                </div>


                <!-- Advertencia -->

                <div class="warning-message">

                    <svg xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />

                        <path d="M12 9v4" />

                        <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" />

                        <path d="M12 16h.01" />

                    </svg>

                    <span>
                        PELIGRO: SU CONSUMO NO ES APTO PARA PERSONAS NORMALES
                    </span>

                </div>

            </section>


            <!-- =========================
                 ACCIONES
            ========================== -->

            <section class="hero-actions">

                <button>

                    <svg xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />

                        <path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11" />

                    </svg>

                    CONSIGUE GUEPARDEX AHORA

                </button>


                <span>
                    Descubre la leyenda
                </span>


                <button>
                </button>

            </section>

        </section>

    </main>

</body>

</html>

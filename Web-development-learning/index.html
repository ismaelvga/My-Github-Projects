
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guepardex</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">

        <nav class="main-nav">

            <button
                class="menu-button"
                id="menu-button"
                type="button"
                aria-label="Abrir menú"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path
                        stroke="none"
                        d="M0 0h24v24H0z"
                        fill="none"
                    />
                    <path d="M4 20h16" />
                    <path d="M4 12h16" />
                    <path d="M4 4h16" />
                </svg>
            </button>


            
            <a href="index.html" class="brand-link">

                <img
                    id="brand-logo"
                    src="images/Logo.webp"
                    alt="Logo de Guepardex"
                >

                <span class="brand-name">
                    Guepardex
                </span>

            </a>


            <a href="#xe" class="xe-button">
                Consigue XE
            </a>

        </nav>

    </header>



    <main>


        <section class="hero">

            <div class="hero-info">

                <span class="protocol-label">
                    [ PROTOCOL: HIGH_OCTANE ]
                </span>

                <span class="system-version">
                    SYS.VER // 2004.X
                </span>

            </div>

            <div class="hero-content">

                <p class="hero-description">
                    LA BEBIDA ENERGÉTICA EXTREMA
                </p>

                <h1 class="hero-title">
                    CHEETAH
                    <br>
                    CHUG
                </h1>

                <span class="hero-slogan">
                    // LIBERA TU VELOCIDAD INTERNA //
                </span>

            </div>

            <section class="product-stats" id="xe">

                <div class="product-image">

                    <img
                        id="cheetah-chug-lata"
                        src="images/Clipboard-Image-copy.png"
                        alt="Lata de Cheetah Chug"
                    >

                </div>


                <div class="stat">

                    <span class="stat-label">
                        OCTANE LEVEL
                    </span>

                    <strong class="stat-value">
                        1400%
                    </strong>

                </div>


                <div class="stat">

                    <span class="stat-label">
                        BPM BOOST
                    </span>

                    <strong class="bpm-value">
                        +180 BPM
                    </strong>

                </div>

                <div class="warning-message">

                    <span class="warning-text">

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                stroke="none"
                                d="M0 0h24v24H0z"
                                fill="none"
                            />
                            <path d="M12 9v4" />
                            <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636-2.87l-8.106-13.536a1.914 1.914 0 0 0 -3.274 0" />
                            <path d="M12 16h.01" />
                        </svg>

                        PELIGRO: SU CONSUMO NO ES APTO PARA PERSONAS NORMALES!

                    </span>

                </div>

            </section>

            <section class="hero-actions">

                <button
                    class="get-xe-button"
                    type="button"
                >

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path
                            stroke="none"
                            d="M0 0h24v24H0z"
                            fill="none"
                        />
                        <path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11" />
                    </svg>

                    <span class="get-xe-text">
                        CONSIGUE XE AHORA
                    </span>

                </button>


                <button
                    class="legend-button"
                    type="button"
                >
                    <span class="legend-link">
                        DESCUBRE LA LEYENDA
                    </span>
                </button>

            </section>

        </section>

    </main>

</body>

</html>
